name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check that package.json matches the tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Build
        run: npm run build && npm run verify

      - name: Extract changelog section
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          awk -v tag="$TAG_NAME" -v version="$VERSION" '
            /^##[[:space:]]+/ {
              if (found == 1) exit
              heading=$0
              gsub(/^##[[:space:]]+/, "", heading)
              gsub(/[[:space:]]+$/, "", heading)
              if (heading == tag || heading == version || heading == "[" tag "]" || heading == "[" version "]") { found=1; next }
            }
            found == 1 { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'ImageNote %s\n\nSee CHANGELOG.md for details.\n' "$TAG_NAME" > release-notes.md
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${TAG_NAME}" =~ (a|b|rc|beta|alpha)[0-9]*$ ]]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.md "${FLAGS[@]}"
          fi
          gh release upload "$TAG_NAME" dist/imagenote-card.js --clobber
